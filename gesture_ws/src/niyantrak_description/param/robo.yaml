amcl:
  ros__parameters:
    use_sim_time: False
    alpha1: 0.15
    alpha2: 0.15
    alpha3: 0.15
    alpha4: 0.15
    alpha5: 0.15
    base_frame_id: "base_footprint"
    beam_skip_distance: 0.3  # Reduce for better accuracy
    beam_skip_error_threshold: 0.8
    beam_skip_threshold: 0.2
    do_beamskip: true  # Enable for better scan-based localization
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 30.0  # Reduce to avoid unnecessary processing
    laser_min_range: 0.1
    laser_model_type: "likelihood_field"
    max_beams: 80  # Increase for better scan quality
    max_particles: 3000  # Increase for higher localization accuracy
    min_particles: 800  # Increase to avoid localization failures
    odom_frame_id: "odom"
    pf_err: 0.03  # Reduce for better accuracy
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 1.0  # Increase to update frequently
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 0.5  # Reduce to avoid large TF delays
    update_min_a: 0.15
    update_min_d: 0.20
    z_hit: 0.6
    z_max: 0.02
    z_rand: 0.4
    z_short: 0.05
    scan_topic: scan

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0  # Increase for faster updates
      publish_frequency: 5.0  # Publish more frequently
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: False
      rolling_window: true
      width: 2.0  # Reduce for better maneuverability
      height: 2.0
      resolution: 0.025  # Increase resolution for better precision
      robot_radius: 0.3  # Reduce for better navigation in narrow spaces
      plugins: ["obstacle_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.4  # Reduce to fit in narrow spaces
        cost_scaling_factor: 4.0
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
      always_send_full_costmap: False

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 2.0
      publish_frequency: 2.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: True
      robot_radius: 0.3  # Reduce to fit in narrow spaces
      resolution: 0.05
      track_unknown_space: false  # Disable unknown space tracking
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0
        inflation_radius: 0.5  # Reduce for tight navigation
      always_send_full_costmap: False

controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 15.0  # Increase for smoother control
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.3  # Reduce for tighter turns
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.2  # Reduce failure tolerance for better control
    controller_plugins: ["FollowPath"]

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: False
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.3  # Increase max speed slightly
      max_vel_y: 0.0
      max_vel_theta: 1.5  # Increase for better rotation
      min_speed_xy: 0.05  # Avoid stopping too often
      max_speed_xy: 0.3
      min_speed_theta: 0.1
      acc_lim_x: 3.0
      acc_lim_y: 0.0
      acc_lim_theta: 3.5
      vx_samples: 20
      vy_samples: 0
      vtheta_samples: 40
      sim_time: 3.0  # Increase to predict motion better
      linear_granularity: 0.025
      angular_granularity: 0.02
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.03  # Reduce for precise stopping
      yaw_goal_tolerance: 0.05
      trans_stopped_velocity: 0.1
      stateful: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 10.0
    use_sim_time: False
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.2  # Reduce for precise path-following
      use_astar: true  # Enable A* for better planning
      allow_unknown: false  # Avoid unknown areas

waypoint_follower:
  ros__parameters:
    loop_rate: 200
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 100  # Reduce pause duration
